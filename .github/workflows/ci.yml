name: CI
on:
  push:
    branches: [ main, env/**, feat/**, lab** ]

  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bozdogalex/bioinf-y4-lab:base
    steps:
      - uses: actions/checkout@v4
      - name: Python compile (fail fast on syntax errors)
        run: |
          python -m compileall -q labs mlops

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bozdogalex/bioinf-y4-lab:base
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke
        run: python labs/00_smoke/smoke.py
      - name: Lab 1 and 2 teaching regressions
        run: python -m unittest discover -s tests -p 'test_lab12*.py' -v

  mlflow:
    name: mlflow
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bozdogalex/bioinf-y4-lab:base
    steps:
      - uses: actions/checkout@v4
      - name: MLflow smoke (no UI)
        run: python labs/00_smoke/mlflow_smoke.py --experiment "BIOINF-Y4 Demo"

  # Optional: non-blocking style advice
  lint:
    name: lint (advice)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bozdogalex/bioinf-y4-lab:base
    steps:
      - uses: actions/checkout@v4
      - name: flake8 (advisory, does not fail)
        run: flake8 labs || true

